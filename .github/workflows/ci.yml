name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore Bun and build caches
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-${{ hashFiles('.bun-version') }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generate translations
        run: bun run generate-paraglide

      - name: Check types
        run: bun run typecheck

      - name: Check formatting and lint
        run: bun run check

      - name: Run unit and security tests
        timeout-minutes: 10
        run: bun run test:unit

      - name: Run isolated D1 integration tests
        timeout-minutes: 30
        run: bun run test:integration

      - name: Run Bun runtime tests
        timeout-minutes: 10
        run: bun run test:bun-runtime

      - name: Build Workers
        run: bun run build

      - name: Build Bun
        run: bun run build:bun
